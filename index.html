<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>personal hub · calm & focused</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Burger button (moves to sidebar top-right when open) -->
  <button id="burger-btn" class="burger-btn" aria-label="Toggle menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>

  <!-- Left sidebar -->
  <aside id="sidebar" class="sidebar" aria-hidden="true">
    <div class="sidebar-header">
      <h1 class="sidebar-title">personal hub</h1>
      <!-- close button removed; burger itself moves here -->
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-group-label">important stuff</div>
      <a class="sidebar-link" href="#" data-page="deadlines">⏳ deadlines</a>
      <a class="sidebar-link" href="#" data-page="todos">✅ to-do list</a>
      <a class="sidebar-link" href="#" data-page="focus">🎯 what now?</a>
      <a class="sidebar-link" href="#" data-page="checkin">📅 daily check-in</a>
      <a class="sidebar-link" href="#" data-page="notes">📝 quick notes</a>

      <div class="sidebar-group-label">things i love</div>
      <a class="sidebar-link" href="#" data-page="gamepicker">🎮 mood game picker</a>
      <a class="sidebar-link" href="#" data-page="playtracking">⏱️ play tracking</a>
      <a class="sidebar-link" href="#" data-page="moodlog">📊 mood log</a>
      <a class="sidebar-link" href="#" data-page="journal">🎨 project journal</a>
      <a class="sidebar-link" href="#" data-page="data">💾 data</a>

      <div class="sidebar-group-label">home</div>
      <a class="sidebar-link" href="#" data-page="home">🏠 home</a>
    </nav>
  </aside>

  <!-- Overlay for left sidebar (mobile) -->
  <div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true"></div>

  <!-- Right-side dock (widgets) -->
  <div id="dock" class="dock">
    <div id="dock-body" class="dock-body"></div>
  </div>

  <!-- Toggle buttons for widgets (fixed, right edge) -->
  <div id="dock-buttons" class="dock-buttons">
    <button class="dock-toggle" data-widget="todos" title="To-do">✅</button>
    <button class="dock-toggle" data-widget="deadlines" title="Deadlines">⏳</button>
    <button class="dock-toggle" data-widget="continue" title="Continue playing">🎮</button>
  </div>

  <!-- App content -->
  <div class="app" id="app"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
